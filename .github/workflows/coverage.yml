name: Coverage measurement

# Manual diagnostic coverage. The final Mode B coverage gate also runs from mode-b.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop Rust coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install Linux desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler libdbus-1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Measure desktop coverage
        working-directory: ./app/main/src-tauri
        run: |
          cargo +stable llvm-cov \
            --no-default-features \
            --bin rquickshare \
            --summary-only \
            --ignore-filename-regex 'target/|bindings/|core_lib/'

  rust:
    name: Rust core coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler dbus-daemon libdbus-1-dev

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Measure core coverage
        working-directory: ./core_lib
        run: |
          cargo llvm-cov \
            --all-features \
            --summary-only \
            --ignore-filename-regex 'target/|bindings/'

  frontend:
    name: Frontend coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pinned pnpm
        run: npm install --global pnpm@9.7.0

      - name: Install frontend dependencies
        working-directory: ./app/main
        run: pnpm install --frozen-lockfile

      - name: Measure frontend coverage
        working-directory: ./app/main
        run: |
          pnpm exec vitest run \
            --coverage \
            --coverage.provider=v8 \
            --coverage.reporter=text \
            --coverage.include='src/**/*.{ts,vue}' \
            --coverage.exclude='src/auto-imports.d.ts'
