name: Preflight

on:
  push:
    branches: [ "dev", "master" ]
    paths-ignore:
      - 'docs/**'
      - 'doc/**'
      - '**/docs/**'
      - '**/doc/**'
      - 'README.md'
      - '**/README.md'
      - 'AGENT.md'
      - '**/AGENT.md'
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - 'CHANGELOG.md'
      - '**/CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - '**/CONTRIBUTING.md'
      - '.github/agents/**'
      - '.codex.md'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust_format:
    name: Rust format
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.head.ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        working-directory: ./app/main/src-tauri
        run: cargo fmt --all --check

      - name: Validate receiver A/B smoke launcher
        run: |
          bash -n scripts/receiver-ab-smoke.sh
          bash scripts/receiver-ab-smoke.sh --help >/dev/null
          if bash scripts/receiver-ab-smoke.sh unknown >/dev/null 2>&1; then
            echo "Unknown A/B mode must fail" >&2
            exit 1
          fi

      - name: Enforce fast development and protected release workflow cadence
        run: bash scripts/ci-check-workflow-policy.sh

      - name: Validate stable/race-sensitive CI group inventory script
        run: |
          bash -n scripts/ci-core-test-groups.sh
          bash scripts/ci-core-test-groups.sh --help >/dev/null
          if bash scripts/ci-core-test-groups.sh unknown >/dev/null 2>&1; then
            echo "Unknown core CI test group must fail" >&2
            exit 1
          fi
          test "$(bash scripts/ci-core-test-groups.sh list | wc -l)" -eq 8

      - name: Offline Python contract tests with pinned publication dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/native-publication-python"
          "$RUNNER_TEMP/native-publication-python/bin/python" -m pip install -r scripts/requirements-r2.txt
          "$RUNNER_TEMP/native-publication-python/bin/python" -m unittest discover -s scripts/tests -v

  frontend:
    name: Frontend lint, typecheck and unit tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.head.ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@9.7.0

      - name: Install dependencies
        working-directory: ./app/main
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ./app/main
        run: pnpm lint

      - name: Type check
        working-directory: ./app/main
        run: pnpm ts-check

      - name: Unit tests
        working-directory: ./app/main
        run: pnpm exec vitest run

  core_tests:
    name: Core Rust tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.head.ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install core dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler dbus-daemon libdbus-1-dev

      - name: Run stable Core Rust tests once
        run: bash scripts/ci-core-test-groups.sh stable

      # Race-sensitive 10x verification is reserved for the validated release-tag Mode B gate.

  clippy:
    name: Clippy (${{ matrix.directory }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.head.ref != 'dev'
    strategy:
      matrix:
        include:
          - directory: core_lib
            clippy_args: "--all-features --all-targets"
            os: ubuntu-latest
          - directory: app/main/src-tauri
            clippy_args: "--no-default-features --all-targets"
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            libdbus-1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Tauri WebKit dependencies
        if: matrix.directory == 'app/main/src-tauri'
        run: |
          sudo apt-get install -y \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev

      - name: Clippy
        working-directory: ${{ matrix.directory }}
        run: cargo +stable clippy ${{ matrix.clippy_args }} -- -D warnings

      - name: Desktop Rust unit tests
        if: matrix.directory == 'app/main/src-tauri'
        working-directory: ./app/main/src-tauri
        run: cargo +stable test --no-default-features --bin rquickshare
