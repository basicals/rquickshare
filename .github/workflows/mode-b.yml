name: Mode B validation

on:
  push:
    tags:
      - "mode-b-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mode-b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full_suite:
    name: Complete automated suite 10x
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler libdbus-1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev

      - name: Install pinned pnpm
        run: npm install --global pnpm@9.7.0

      - name: Install frontend dependencies
        working-directory: ./app/main
        run: pnpm install --frozen-lockfile

      - name: Run complete suite ten consecutive times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            echo "=== Mode B attempt ${attempt}/10: Rust ==="
            (
              cd core_lib
              cargo test --all-features
            )

            echo "=== Mode B attempt ${attempt}/10: desktop Rust ==="
            (
              cd app/main/src-tauri
              cargo +stable test --no-default-features --bin rquickshare
            )

            echo "=== Mode B attempt ${attempt}/10: frontend ==="
            (
              cd app/main
              pnpm exec vitest run
            )

            echo "=== Mode B attempt ${attempt}/10: offline analyzer ==="
            python3 -m unittest discover -s scripts/tests
          done

  coverage:
    name: Final coverage measurement
    needs: full_suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler libdbus-1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Install pinned pnpm
        run: npm install --global pnpm@9.7.0

      - name: Install frontend dependencies
        working-directory: ./app/main
        run: pnpm install --frozen-lockfile

      - name: Measure Rust core coverage
        working-directory: ./core_lib
        run: |
          cargo llvm-cov \
            --all-features \
            --summary-only \
            --ignore-filename-regex 'target/|bindings/'

      - name: Measure frontend coverage
        working-directory: ./app/main
        run: |
          pnpm exec vitest run \
            --coverage \
            --coverage.provider=v8 \
            --coverage.reporter=text \
            --coverage.include='src/**/*.{ts,vue}' \
            --coverage.exclude='src/auto-imports.d.ts'

      - name: Measure desktop Rust coverage
        working-directory: ./app/main/src-tauri
        run: |
          cargo +stable llvm-cov \
            --no-default-features \
            --bin rquickshare \
            --summary-only \
            --ignore-filename-regex 'target/|bindings/|core_lib/'
