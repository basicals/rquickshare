name: Mode B validation

# Only the validated master-HEAD release-tag workflow may call the 10x gate.
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: mode-b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full_suite:
    name: Complete automated suite 10x
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler dbus-daemon libdbus-1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev

      - name: Install pinned pnpm
        run: npm install --global pnpm@9.7.0

      - name: Install frontend dependencies
        working-directory: ./app/main
        run: pnpm install --frozen-lockfile

      - name: Install pinned Python publication contract dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/mode-b-python"
          "$RUNNER_TEMP/mode-b-python/bin/python" -m pip install -r scripts/requirements-r2.txt

      - name: Verify critical sharing scenarios are present in the full suite
        working-directory: ./core_lib
        shell: bash
        run: |
          set -euo pipefail
          cargo test --all-features --lib -- --list > "$RUNNER_TEMP/mode-b-tests.list"
          for case in \
            given_managed_user_decline_when_two_files_are_offered_then_real_encrypted_reject_has_no_file_authority \
            given_user_decline_and_peer_socket_loss_when_reject_cannot_be_sent_then_terminal_rejected_has_no_publication \
            given_remote_cancel_after_accept_before_or_after_first_file_when_handled_then_only_durable_members_survive \
            given_managed_text_or_link_when_explicitly_accepted_and_fragmented_then_exact_utf8_is_exposed_only_after_finished \
            given_nested_folder_and_existing_root_when_managed_transfer_completes_then_original_tree_and_verified_files_coexist \
            given_interrupted_multifile_receive_when_retry_is_explicit_then_new_consent_preserves_first_and_writes_only_new_names
          do
            full="hdl::inbound::security_tests::receive_reliability::${case}: test"
            count="$(grep -Fxc -- "$full" "$RUNNER_TEMP/mode-b-tests.list" || true)"
            if [[ "$count" != 1 ]]; then
              echo "Critical sharing test missing or duplicated: $case (found $count)" >&2
              exit 1
            fi
          done

      - name: Run complete suite ten consecutive times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            echo "=== Mode B attempt ${attempt}/10: Rust ==="
            (
              cd core_lib
              cargo test --all-features
            )

            echo "=== Mode B attempt ${attempt}/10: desktop Rust ==="
            (
              cd app/main/src-tauri
              cargo +stable test --no-default-features --bin rquickshare
            )

            echo "=== Mode B attempt ${attempt}/10: frontend ==="
            (
              cd app/main
              pnpm exec vitest run
            )

            echo "=== Mode B attempt ${attempt}/10: offline analyzer ==="
            "$RUNNER_TEMP/mode-b-python/bin/python" -m unittest discover -s scripts/tests
          done

  native_gtk:
    name: Native GTK isolated UI complete suite 10x
    needs: full_suite
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: Install native test prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git curl build-essential pkg-config \
            protobuf-compiler libdbus-1-dev libudev-dev libgtk-4-dev \
            libgtk4-layer-shell-dev libfontconfig-dev libseccomp-dev \
            bubblewrap glycin-loaders dbus-daemon dbus-x11 xvfb xauth

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2.9.0
        with:
          workspaces: |
            core_lib -> target
            native_desktop -> target
          shared-key: native-gtk-ui-ubuntu-26.04

      - name: Native GTK source formatting and lint
        run: |
          cargo +nightly fmt --manifest-path native_desktop/Cargo.toml -- --check
          cargo +stable clippy --locked --manifest-path native_desktop/Cargo.toml --all-targets --no-deps -- -D warnings

      - name: Run native GTK complete suite ten consecutive times
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/core_lib/target/native-ui-test-tmp"
          export TMPDIR="$GITHUB_WORKSPACE/core_lib/target/native-ui-test-tmp"
          cargo +stable build --locked --manifest-path native_desktop/Cargo.toml --bin rquickshare-preview-helper
          for attempt in $(seq 1 10); do
            echo "=== Mode B attempt ${attempt}/10: Native GTK ==="
            GTK_A11Y=none GDK_BACKEND=x11 GSK_RENDERER=cairo \
              dbus-run-session --config-file docs/prototypes/preview-bus.conf -- \
              xvfb-run -a cargo +stable test --locked --manifest-path native_desktop/Cargo.toml --bin rquickshare
          done

  coverage:
    name: Final coverage measurement
    needs: [full_suite, native_gtk]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler dbus-daemon libdbus-1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Install pinned pnpm
        run: npm install --global pnpm@9.7.0

      - name: Install frontend dependencies
        working-directory: ./app/main
        run: pnpm install --frozen-lockfile

      - name: Measure Rust core coverage
        working-directory: ./core_lib
        run: |
          cargo llvm-cov \
            --all-features \
            --summary-only \
            --ignore-filename-regex 'target/|bindings/'

      - name: Measure frontend coverage
        working-directory: ./app/main
        run: |
          pnpm exec vitest run \
            --coverage \
            --coverage.provider=v8 \
            --coverage.reporter=text \
            --coverage.include='src/**/*.{ts,vue}' \
            --coverage.exclude='src/auto-imports.d.ts'

      - name: Measure desktop Rust coverage
        working-directory: ./app/main/src-tauri
        run: |
          cargo +stable llvm-cov \
            --no-default-features \
            --bin rquickshare \
            --summary-only \
            --ignore-filename-regex 'target/|bindings/|core_lib/'
