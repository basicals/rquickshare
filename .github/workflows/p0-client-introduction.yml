name: P0 BWU introduction parser ten-run

# The validated release-tag Mode B suite covers these tests automatically.
# Manual standalone stress diagnostics are allowed only on main-HEAD version tags.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-client-introduction-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  bwu-introduction:
    name: Real BWU TCP introduction parser 3 cases x10
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Admit only annotated version tag on current master
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          git fetch --no-tags origin master
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master^{commit})"
      - uses: dtolnay/rust-toolchain@stable

      - name: Install matching Core dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler dbus-daemon libdbus-1-dev

      - name: Verify the exact compiled high-risk test inventory
        shell: bash
        working-directory: core_lib
        run: |
          set -euo pipefail
          cargo +stable test --all-features --lib -- --list > "$RUNNER_TEMP/p0-client-intro.list"
          for name in \
            given_invalid_bwu_introduction_fields_when_validated_then_no_identity_is_admitted \
            given_partial_or_malformed_bwu_tcp_prefix_when_peeked_then_only_complete_valid_identity_is_returned \
            given_bwu_current_and_last_ids_when_compared_then_only_exact_expected_id_matches
          do
            expected="hdl::inbound::security_tests::${name}: test"
            found="$(grep -Fxc -- "$expected" "$RUNNER_TEMP/p0-client-intro.list" || true)"
            if [[ "$found" != 1 ]]; then
              echo "P0 BWU TCP introduction method missing/duplicated: $name (found $found)" >&2
              exit 1
            fi
          done

      - name: Repeat all three real validator methods ten times
        shell: bash
        working-directory: core_lib
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            echo "=== P0 BWU TCP introduction attempt $attempt/10 ==="
            for name in \
              given_invalid_bwu_introduction_fields_when_validated_then_no_identity_is_admitted \
              given_partial_or_malformed_bwu_tcp_prefix_when_peeked_then_only_complete_valid_identity_is_returned \
              given_bwu_current_and_last_ids_when_compared_then_only_exact_expected_id_matches
            do
              full="hdl::inbound::security_tests::${name}"
              log="$RUNNER_TEMP/p0-client-intro-${attempt}-${name}.log"
              cargo +stable test --all-features --lib "$full" -- --exact --nocapture 2>&1 | tee "$log"
              if ! grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;' "$log"; then
                echo "Incomplete P0 BWU TCP introduction test: $name attempt $attempt/10" >&2
                exit 1
              fi
            done
          done
          echo "P0 BWU TCP introduction: all 3 exact tests passed ten consecutive times."
