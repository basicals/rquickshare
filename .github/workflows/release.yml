name: Build release artifacts

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Optional label for this manual build'
        required: false
        default: 'manual'

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build_release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            name: main
            target_path: app/main
            dependencies: |
              sudo apt-get install -y libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev
            cache_directory: app/main/src-tauri/target
          - os: macos-latest
            name: main
            target_path: app/main
            cache_directory: app/main/src-tauri/target
          - os: macos-15-intel
            name: main
            target_path: app/main
            cache_directory: app/main/src-tauri/target

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@9.7.0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: contains(matrix.os, 'macos') == false
        run: |
          sudo apt-get update
          sudo apt-get install -y             protobuf-compiler             libdbus-1-dev             libgtk-3-dev             libayatana-appindicator3-dev             librsvg2-dev

      - name: Install macOS dependencies
        if: contains(matrix.os, 'macos')
        run: brew install protobuf

      - name: Install platform dependencies
        if: contains(matrix.os, 'macos') == false
        run: ${{ matrix.dependencies }}

      - name: Report GLIBC version
        if: contains(matrix.os, 'macos') == false
        run: |
          GLIBC_VER=$(ldd --version | head -n1 | awk '{print $NF}')
          echo "GLIBC version: ${GLIBC_VER}"

      - name: Install frontend dependencies
        working-directory: ./${{ matrix.target_path }}
        run: pnpm install --frozen-lockfile

      - name: Build release package
        run: |
          rm -rf ${{ github.workspace }}/${{ matrix.target_path }}/src-tauri/target/release/bundle/
          cd ./${{ matrix.target_path }}
          pnpm build
          cd ${{ github.workspace }}
          ./rename_build.sh ${{ github.workspace }}/${{ matrix.target_path }}/src-tauri/target/release/bundle/ ${{ matrix.name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: artifact-release-rquickshare-${{ matrix.os }}
          path: |
            ${{ github.workspace }}/${{ matrix.target_path }}/src-tauri/target/release/bundle/*/r-quick-share-${{ matrix.name }}*
          if-no-files-found: error
