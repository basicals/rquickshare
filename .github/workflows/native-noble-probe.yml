name: Native GTK4 - Ubuntu 24.04 compatibility probe

on:
  push:
    branches:
      - gtk4-noble
    paths:
      - '.github/workflows/native-noble-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-noble-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      PKG_CONFIG_PATH: /opt/rquickshare-noble/lib/x86_64-linux-gnu/pkgconfig:/opt/rquickshare-noble/lib/pkgconfig:/opt/rquickshare-noble/share/pkgconfig
      LD_LIBRARY_PATH: /opt/rquickshare-noble/lib/x86_64-linux-gnu:/opt/rquickshare-noble/lib
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4

      - name: Install Noble build dependencies (runner only)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config protobuf-compiler libdbus-1-dev \
            libgtk-4-dev libglib2.0-dev libfontconfig1-dev libseccomp-dev \
            libwayland-dev wayland-protocols libgirepository1.0-dev \
            gobject-introspection meson ninja-build git libxkbcommon-dev \
            libssl-dev libclang-dev clang libudev-dev libavahi-client-dev \
            libpipewire-0.3-dev libx11-dev libxkbcommon-x11-dev \
            liblcms2-dev libheif-dev libjxl-dev libjpeg-dev \
            libpng-dev librsvg2-dev bubblewrap dbus-user-session \
            python3 dpkg-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Record baseline versions
        run: |
          mkdir -p noble-diagnostics
          {
            cat /etc/os-release
            rustc --version
            cargo --version
            pkg-config --modversion gtk4
            pkg-config --modversion glib-2.0
            apt-cache policy glycin-loaders libgtk4-layer-shell0 || true
          } 2>&1 | tee noble-diagnostics/environment.txt

      - name: Build private GTK4 Layer Shell 1.0.4
        run: |
          git clone --depth 1 --branch v1.0.4 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell \
            --prefix=/opt/rquickshare-noble --libdir=lib/x86_64-linux-gnu \
            --buildtype=release
          meson compile -C /tmp/gtk4-layer-shell/build
          sudo meson install -C /tmp/gtk4-layer-shell/build
          pkg-config --modversion gtk4-layer-shell-0

      - name: Build native daemon
        run: |
          set -o pipefail
          cargo +stable build --locked --release \
            --manifest-path core_lib/Cargo.toml --bin rquickshare-daemon \
            2>&1 | tee noble-diagnostics/daemon-build.log

      - name: Build native GTK4 UI and preview helper
        run: |
          set -o pipefail
          cargo +stable build --locked --release \
            --manifest-path native_desktop/Cargo.toml \
            --bin rquickshare --bin rquickshare-preview-helper \
            2>&1 | tee noble-diagnostics/native-build.log

      - name: Inspect runtime dependencies
        if: success()
        run: |
          {
            for binary in core_lib/target/release/rquickshare-daemon \
                          native_desktop/target/release/rquickshare \
                          native_desktop/target/release/rquickshare-preview-helper; do
              echo "======= ${binary} ======="
              file "$binary"
              readelf -d "$binary" | grep NEEDED || true
              ldd "$binary" || true
            done
            find /opt/rquickshare-noble -type f | sort
          } 2>&1 | tee noble-diagnostics/binary-dependencies.txt

      - name: Upload diagnostics even if compilation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-noble-compatibility-diagnostics
          path: noble-diagnostics/
          if-no-files-found: warn
