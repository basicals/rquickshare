name: Native GTK4 - Ubuntu 24.04 compatibility probe

on:
  push:
    branches:
      - gtk4-noble
    paths:
      - '.github/workflows/native-noble-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-noble-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      PKG_CONFIG_PATH: /opt/rquickshare-noble/lib/x86_64-linux-gnu/pkgconfig:/opt/rquickshare-noble/lib/pkgconfig:/opt/rquickshare-noble/share/pkgconfig
      LD_LIBRARY_PATH: /opt/rquickshare-noble/lib/x86_64-linux-gnu:/opt/rquickshare-noble/lib
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5

      - name: Install Noble build dependencies (runner only)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config protobuf-compiler libdbus-1-dev \
            libgtk-4-dev libglib2.0-dev libfontconfig1-dev libseccomp-dev \
            libwayland-dev wayland-protocols libgirepository1.0-dev \
            gobject-introspection valac meson ninja-build git libxkbcommon-dev \
            libssl-dev libclang-dev clang libudev-dev libavahi-client-dev \
            libpipewire-0.3-dev libx11-dev libxkbcommon-x11-dev \
            liblcms2-dev libheif-dev libjxl-dev libjpeg-dev \
            libpng-dev librsvg2-dev bubblewrap dbus-user-session \
            python3 dpkg-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Record baseline versions
        run: |
          mkdir -p noble-diagnostics
          {
            cat /etc/os-release
            rustc --version
            cargo --version
            pkg-config --modversion gtk4
            pkg-config --modversion glib-2.0
            apt-cache policy glycin-loaders libgtk4-layer-shell0 || true
          } 2>&1 | tee noble-diagnostics/environment.txt

      - name: Build private GTK4 Layer Shell 1.0.4
        run: |
          git clone --depth 1 --branch v1.0.4 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell \
            --prefix=/opt/rquickshare-noble --libdir=lib/x86_64-linux-gnu \
            --buildtype=release
          meson compile -C /tmp/gtk4-layer-shell/build
          sudo meson install -C /tmp/gtk4-layer-shell/build
          pkg-config --modversion gtk4-layer-shell-0

      - name: Build native daemon
        run: |
          set -o pipefail
          cargo +stable build --locked --release \
            --manifest-path core_lib/Cargo.toml --bin rquickshare-daemon \
            2>&1 | tee noble-diagnostics/daemon-build.log

      - name: Build native GTK4 UI and preview helper
        run: |
          set -o pipefail
          cargo +stable build --locked --release \
            --manifest-path native_desktop/Cargo.toml \
            --bin rquickshare --bin rquickshare-preview-helper \
            2>&1 | tee noble-diagnostics/native-build.log

      - name: Inspect runtime dependencies
        if: success()
        run: |
          {
            for binary in core_lib/target/release/rquickshare-daemon \
                          native_desktop/target/release/rquickshare \
                          native_desktop/target/release/rquickshare-preview-helper; do
              echo "======= ${binary} ======="
              file "$binary"
              readelf -d "$binary" | grep NEEDED || true
              ldd "$binary" || true
            done
            find /opt/rquickshare-noble -type f | sort
          } 2>&1 | tee noble-diagnostics/binary-dependencies.txt

      - name: Stage native Noble runtime payload (not installable yet)
        if: success()
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/rquickshare-native-noble"
          mkdir -p "$stage/usr/bin" "$stage/usr/libexec" "$stage/usr/lib/rquickshare-private"
          install -m 0755 native_desktop/target/release/rquickshare "$stage/usr/bin/rquickshare"
          install -m 0755 native_desktop/target/release/rquickshare-preview-helper "$stage/usr/libexec/rquickshare-preview-helper"
          install -m 0755 core_lib/target/release/rquickshare-daemon "$stage/usr/libexec/rquickshare-daemon"
          cp -a /opt/rquickshare-noble/lib/x86_64-linux-gnu/libgtk4-layer-shell.so* "$stage/usr/lib/rquickshare-private/"
          patchelf --set-rpath '$ORIGIN/../lib/rquickshare-private' "$stage/usr/bin/rquickshare"
          for executable in "$stage/usr/libexec/rquickshare-daemon" "$stage/usr/libexec/rquickshare-preview-helper"; do
            patchelf --set-rpath '$ORIGIN/../lib/rquickshare-private' "$executable"
          done
          {
            echo "Native Noble preliminary payload, not an installer."
            echo "Glycin 2.x loaders are NOT bundled. Do not install this payload on the host."
            echo "GTK layer shell private library included:"
            ls -l "$stage/usr/lib/rquickshare-private"
            echo "ELF rpath and dependencies:"
            for executable in "$stage/usr/bin/rquickshare" "$stage/usr/libexec/rquickshare-daemon" "$stage/usr/libexec/rquickshare-preview-helper"; do
              echo "--- $executable ---"
              patchelf --print-rpath "$executable"
              readelf -d "$executable" | grep NEEDED || true
            done
          } | tee noble-diagnostics/staging.txt
          tar -C "$stage" -czf noble-diagnostics/rquickshare-native-noble-runtime-preview.tar.gz .
          echo "Preliminary runtime assembled; Glycin 2.x packaging still pending."

      - name: Investigate Glycin 2.x loader compatibility
        if: success()
        run: |
          {
            echo "Noble Glycin version:"
            apt-cache show glycin-loaders | grep -E '^(Version|Depends):' | head -5 || true
            echo "Glycin 2.x decoder depends on a separate runtime loader distribution."
            echo "The source uses glycin =4.0.0 (Rust API); Noble ships glycin-loaders=1.0.1."
            echo "Do not weaken required Glycin >= 2.1 in native_deb.py."
          } | tee noble-diagnostics/glycin-compatibility.txt

      - name: Probe Glycin 2.1.5 source build on Noble (isolated)
        if: success()
        continue-on-error: true
        run: |
          set -o pipefail
          curl --fail --location --silent --show-error \
            https://download.gnome.org/sources/glycin/2.1/glycin-2.1.5.tar.xz \
            -o /tmp/glycin-2.1.5.tar.xz
          tar -xf /tmp/glycin-2.1.5.tar.xz -C /tmp
          meson setup /tmp/glycin-2.1.5/build /tmp/glycin-2.1.5 \
            --prefix=/opt/rquickshare-noble \
            --buildtype=release \
            -Dglycin-loaders=true \
            -Dloaders=glycin-image-rs \
            -Dlibglycin=false \
            -Dlibglycin-gtk4=false \
            -Dglycin-thumbnailer=false \
            -Dtests=false \
            -Dintrospection=false \
            -Dvapi=false \
            2>&1 | tee noble-diagnostics/glycin-meson-setup.log
          meson compile -C /tmp/glycin-2.1.5/build \
            2>&1 | tee noble-diagnostics/glycin-build.log
          sudo meson install -C /tmp/glycin-2.1.5/build
          find /opt/rquickshare-noble -iname '*glycin*' -o -name '*.conf' \
            | tee noble-diagnostics/glycin-installed-files.txt

      - name: Upload diagnostics even if compilation fails
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-noble-compatibility-diagnostics
          path: noble-diagnostics/
          if-no-files-found: warn
