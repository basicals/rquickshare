name: Native GTK4 - Ubuntu 24.04 compatibility probe

on:
  push:
    branches:
      - gtk4-noble
    paths:
      - '.github/workflows/native-noble-probe.yml'
      - 'scripts/native_noble_probe_deb.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-noble-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      PKG_CONFIG_PATH: /opt/rquickshare-noble/lib/x86_64-linux-gnu/pkgconfig:/opt/rquickshare-noble/lib/pkgconfig:/opt/rquickshare-noble/share/pkgconfig
      LD_LIBRARY_PATH: /opt/rquickshare-noble/lib/x86_64-linux-gnu:/opt/rquickshare-noble/lib
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v5

      - name: Install Noble build dependencies (runner only)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config protobuf-compiler libdbus-1-dev \
            libgtk-4-dev libglib2.0-dev libfontconfig1-dev libseccomp-dev \
            libwayland-dev wayland-protocols libgirepository1.0-dev \
            gobject-introspection valac gettext meson ninja-build git libxkbcommon-dev \
            libssl-dev libclang-dev clang libudev-dev libavahi-client-dev \
            libpipewire-0.3-dev libx11-dev libxkbcommon-x11-dev \
            liblcms2-dev libheif-dev libjxl-dev libjpeg-dev \
            libpng-dev librsvg2-dev bubblewrap dbus-user-session \
            python3 dpkg-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Record baseline versions
        run: |
          mkdir -p noble-diagnostics
          {
            cat /etc/os-release
            rustc --version
            cargo --version
            pkg-config --modversion gtk4
            pkg-config --modversion glib-2.0
            apt-cache policy glycin-loaders libgtk4-layer-shell0 || true
          } 2>&1 | tee noble-diagnostics/environment.txt

      - name: Build private GTK4 Layer Shell 1.0.4
        run: |
          git clone --depth 1 --branch v1.0.4 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell \
            --prefix=/opt/rquickshare-noble --libdir=lib/x86_64-linux-gnu \
            --buildtype=release
          meson compile -C /tmp/gtk4-layer-shell/build
          sudo meson install -C /tmp/gtk4-layer-shell/build
          pkg-config --modversion gtk4-layer-shell-0

      - name: Build native daemon
        run: |
          set -o pipefail
          cargo +stable build --locked --release \
            --manifest-path core_lib/Cargo.toml --bin rquickshare-daemon \
            2>&1 | tee noble-diagnostics/daemon-build.log

      - name: Build native GTK4 UI and preview helper
        run: |
          set -o pipefail
          cargo +stable build --locked --release \
            --manifest-path native_desktop/Cargo.toml \
            --bin rquickshare --bin rquickshare-preview-helper \
            2>&1 | tee noble-diagnostics/native-build.log

      - name: Inspect runtime dependencies
        if: success()
        run: |
          {
            for binary in core_lib/target/release/rquickshare-daemon \
                          native_desktop/target/release/rquickshare \
                          native_desktop/target/release/rquickshare-preview-helper; do
              echo "======= ${binary} ======="
              file "$binary"
              readelf -d "$binary" | grep NEEDED || true
              ldd "$binary" || true
            done
            find /opt/rquickshare-noble -type f | sort
          } 2>&1 | tee noble-diagnostics/binary-dependencies.txt

      - name: Stage native Noble runtime payload (not installable yet)
        if: success()
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/rquickshare-native-noble"
          mkdir -p "$stage/usr/bin" "$stage/usr/libexec" "$stage/usr/lib/rquickshare-private"
          install -m 0755 native_desktop/target/release/rquickshare "$stage/usr/bin/rquickshare"
          install -m 0755 native_desktop/target/release/rquickshare-preview-helper "$stage/usr/libexec/rquickshare-preview-helper"
          install -m 0755 core_lib/target/release/rquickshare-daemon "$stage/usr/libexec/rquickshare-daemon"
          cp -a /opt/rquickshare-noble/lib/x86_64-linux-gnu/libgtk4-layer-shell.so* "$stage/usr/lib/rquickshare-private/"
          patchelf --set-rpath '$ORIGIN/../lib/rquickshare-private' "$stage/usr/bin/rquickshare"
          for executable in "$stage/usr/libexec/rquickshare-daemon" "$stage/usr/libexec/rquickshare-preview-helper"; do
            patchelf --set-rpath '$ORIGIN/../lib/rquickshare-private' "$executable"
          done
          {
            echo "Native Noble preliminary payload, not an installer."
            echo "Glycin 2.x loaders are NOT bundled. Do not install this payload on the host."
            echo "GTK layer shell private library included:"
            ls -l "$stage/usr/lib/rquickshare-private"
            echo "ELF rpath and dependencies:"
            for executable in "$stage/usr/bin/rquickshare" "$stage/usr/libexec/rquickshare-daemon" "$stage/usr/libexec/rquickshare-preview-helper"; do
              echo "--- $executable ---"
              patchelf --print-rpath "$executable"
              readelf -d "$executable" | grep NEEDED || true
            done
          } | tee noble-diagnostics/staging.txt
          tar -C "$stage" -czf noble-diagnostics/rquickshare-native-noble-runtime-preview.tar.gz .
          echo "Preliminary runtime assembled; Glycin 2.x packaging still pending."

      - name: Investigate Glycin 2.x loader compatibility
        if: success()
        run: |
          {
            echo "Noble Glycin version:"
            apt-cache show glycin-loaders | grep -E '^(Version|Depends):' | head -5 || true
            echo "Glycin 2.x decoder depends on a separate runtime loader distribution."
            echo "The source uses glycin =4.0.0 (Rust API); Noble ships glycin-loaders=1.0.1."
            echo "Do not weaken required Glycin >= 2.1 in native_deb.py."
          } | tee noble-diagnostics/glycin-compatibility.txt

      - name: Probe Glycin 2.1.5 source build on Noble (isolated)
        if: success()
        run: |
          set -euo pipefail
          export RUSTC="$(rustup which rustc)"
          export RUSTDOC="$(rustup which rustdoc)"
          "$RUSTC" --version
          curl --fail --location --silent --show-error \
            https://download.gnome.org/sources/glycin/2.1/glycin-2.1.5.tar.xz \
            -o /tmp/glycin-2.1.5.tar.xz
          tar -xf /tmp/glycin-2.1.5.tar.xz -C /tmp
          # Glycin's Meson build overrides CARGO_HOME for nested Cargo jobs.
          # Inject the actual compiler into the Meson custom target environment;
          # the shell export alone did not reach that nested invocation.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/glycin-2.1.5/meson.build')
          data = p.read_text()
          marker = "cargo_env.set('CARGO_HOME', cargo_home)"
          assert data.count(marker) == 1
          data = data.replace(marker, marker + "\n" + "cargo_env.set('RUSTC', '/home/runner/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin/rustc')")
          p.write_text(data)
          PY
          meson setup /tmp/glycin-2.1.5/build /tmp/glycin-2.1.5 \
            --prefix=/opt/rquickshare-noble \
            --buildtype=release \
            -Dglycin-loaders=true \
            -Dloaders=glycin-image-rs \
            -Dlibglycin=false \
            -Dlibglycin-gtk4=false \
            -Dglycin-thumbnailer=false \
            -Dtests=false \
            -Dintrospection=false \
            -Dvapi=false \
            2>&1 | tee noble-diagnostics/glycin-meson-setup.log
          meson compile -C /tmp/glycin-2.1.5/build \
            2>&1 | tee noble-diagnostics/glycin-build.log
          sudo meson install -C /tmp/glycin-2.1.5/build
          find /opt/rquickshare-noble -iname '*glycin*' -o -name '*.conf' \
            | tee noble-diagnostics/glycin-installed-files.txt

      - name: Assemble Glycin loader in experimental Noble artifact
        if: success()
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/rquickshare-native-noble"
          mkdir -p "$stage/usr/libexec/glycin-loaders/2+" \
                   "$stage/usr/share/glycin-loaders/2+/conf.d"
          install -m 0755 \
            /opt/rquickshare-noble/libexec/glycin-loaders/2+/glycin-image-rs \
            "$stage/usr/libexec/glycin-loaders/2+/glycin-image-rs"
          sed 's@/opt/rquickshare-noble/libexec/@/usr/libexec/@g' \
            /opt/rquickshare-noble/share/glycin-loaders/2+/conf.d/glycin-image-rs.conf \
            > "$stage/usr/share/glycin-loaders/2+/conf.d/glycin-image-rs.conf"
          grep -q '/usr/libexec/glycin-loaders/2+/glycin-image-rs' \
            "$stage/usr/share/glycin-loaders/2+/conf.d/glycin-image-rs.conf"
          {
            echo 'Experimental runtime archive only — not a validated Debian package.'
            find "$stage" -type f -o -type l | sort
            echo 'Glycin loader system dependencies:'
            ldd "$stage/usr/libexec/glycin-loaders/2+/glycin-image-rs"
          } > noble-diagnostics/glycin-stage-audit.txt
          tar -C "$stage" -czf noble-diagnostics/rquickshare-native-noble-with-glycin.tar.gz .

      - name: Audit staged ELF dynamic dependencies on Noble
        if: success()
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/rquickshare-native-noble"
          report="noble-diagnostics/elf-dependency-audit.txt"
          : > "$report"
          for binary in \
            "$stage/usr/bin/rquickshare" \
            "$stage/usr/libexec/rquickshare-daemon" \
            "$stage/usr/libexec/rquickshare-preview-helper" \
            "$stage/usr/libexec/glycin-loaders/2+/glycin-image-rs" \
            "$stage/usr/lib/rquickshare-private/libgtk4-layer-shell.so.1.0.4"; do
            echo "=== $binary ===" | tee -a "$report"
            readelf -d "$binary" | grep NEEDED | tee -a "$report" || true
            ldd -r "$binary" 2>&1 | tee -a "$report"
            if ldd -r "$binary" 2>&1 | grep -E 'not found|undefined symbol:'; then
              echo "ELF unresolved dependencies detected: $binary" | tee -a "$report"
              exit 1
            fi
          done
          echo "No unresolved dynamic dependencies on the build runner." | tee -a "$report"
          echo "NOTE: the runner is not a clean minimal KDE neon installation." | tee -a "$report"

      - name: Create experimental Debian packaging probe and simulate APT
        if: success()
        run: |
          python3 scripts/native_noble_probe_deb.py
          cat noble-diagnostics/apt-install-simulation.txt

      - name: Install experimental Debian probe in a clean Ubuntu 24.04 container
        if: success()
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --mount "type=bind,source=$PWD/noble-diagnostics,target=/packages,readonly" \
            ubuntu:24.04 bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                /packages/rquickshare-native-noble-PROBE_1.0.0-1_amd64.deb
              dpkg-query -W rquickshare-native-noble-probe
              echo "=== Debian collision policy ==="
              dpkg-deb -f /packages/rquickshare-native-noble-PROBE_1.0.0-1_amd64.deb Package Conflicts Replaces
              echo "=== Existing package filename collision audit ==="
              dpkg-deb --fsys-tarfile /packages/rquickshare-native-noble-PROBE_1.0.0-1_amd64.deb |
                tar -tf - | grep -E "(rquickshare|dbus-1/services|glycin-loaders)" |
                tee /tmp/probe-collision-paths.txt
              test -s /tmp/probe-collision-paths.txt
              echo "WARNING: PROBE has no coexistence policy for an existing rquickshare installation."
              apt-get install -y --no-install-recommends desktop-file-utils dbus-bin
              desktop-file-validate \
                /usr/share/applications/io.github.morozhenko_apps.RQuickShare.desktop
              for unit in rquickshare-daemon.service rquickshare-desktop.service; do
                test -f "/usr/lib/systemd/user/$unit"
                systemd-analyze verify "/usr/lib/systemd/user/$unit"
              done
              for service in \
                io.github.morozhenko_apps.RQuickShare.service \
                io.github.morozhenko_apps.RQuickShare.Desktop.service; do
                test -f "/usr/share/dbus-1/services/$service"
                grep -q "^SystemdService=rquickshare-" \
                  "/usr/share/dbus-1/services/$service"
              done
              test -x /usr/bin/rquickshare
              test -x /usr/libexec/rquickshare-daemon
              test -x /usr/libexec/rquickshare-preview-helper
              test -x /usr/libexec/glycin-loaders/2+/glycin-image-rs
              test -f /usr/share/glycin-loaders/2+/conf.d/glycin-image-rs.conf
              test -f /usr/lib/rquickshare-private/libgtk4-layer-shell.so.1.0.4
              grep -q "/usr/libexec/glycin-loaders/2+/glycin-image-rs" \
                /usr/share/glycin-loaders/2+/conf.d/glycin-image-rs.conf
              for binary in /usr/bin/rquickshare \
                /usr/libexec/rquickshare-daemon \
                /usr/libexec/rquickshare-preview-helper \
                /usr/libexec/glycin-loaders/2+/glycin-image-rs \
                /usr/lib/rquickshare-private/libgtk4-layer-shell.so.1.0.4; do
                echo "Checking ELF in clean Noble container: $binary"
                ldd -r "$binary" | tee /tmp/ldd-check.txt
                if grep -Eq "not found|undefined symbol:" /tmp/ldd-check.txt; then
                  echo "FAIL: missing runtime dependency in clean Noble container"
                  exit 1
                fi
              done
              /usr/libexec/rquickshare-daemon --help
              /usr/libexec/rquickshare-preview-helper --help
              echo "PASS: package installed and ELF dependencies resolved in clean Ubuntu 24.04"
              echo "PASS: static desktop, user units and DBus activation metadata validated"\n              echo "NOT TESTED: interactive GTK desktop, live DBus activation, KDE integration, Bluetooth and transfer"
            ' 2>&1 | tee noble-diagnostics/clean-noble-install.log

      - name: Probe native GTK4 on virtual Wayland session
        if: success()
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            weston dbus-user-session
          mkdir -p noble-diagnostics
          runtime="$(mktemp -d)"
          chmod 700 "$runtime"
          export XDG_RUNTIME_DIR="$runtime"
          export WAYLAND_DISPLAY=wayland-rquickshare
          export GDK_BACKEND=wayland
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" \
            --idle-time=0 > noble-diagnostics/weston-headless.log 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true; rm -rf "$runtime"' EXIT
          for attempt in $(seq 1 30); do
            if test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"; then break; fi
            sleep 1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          dbus-run-session -- bash -euo pipefail -c '
            export XDG_SESSION_TYPE=wayland
            export XDG_CURRENT_DESKTOP=KDE
            export GDK_BACKEND=wayland
            echo "Wayland socket: $XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
            echo "Session bus: $DBUS_SESSION_BUS_ADDRESS"
            dbus-send --session --dest=org.freedesktop.DBus \
              --type=method_call --print-reply /org/freedesktop/DBus \
              org.freedesktop.DBus.ListNames \
              > noble-diagnostics/dbus-live-session.txt
            grep -q org.freedesktop.DBus noble-diagnostics/dbus-live-session.txt
            echo "PASS: real session D-Bus round trip (bus only, not app service activation)."
            timeout 15s native_desktop/target/release/rquickshare --help \
              > noble-diagnostics/gui-probe.txt 2>&1 || code=$?
            echo "GUI --help exit: ${code:-0}" >> noble-diagnostics/gui-probe.txt
            if [ "${code:-0}" -ne 0 ]; then
              cat noble-diagnostics/gui-probe.txt
              exit 1
            fi
            timeout 45s native_desktop/target/release/rquickshare \
              --preview --preview-page nearby --preview-output "$PWD/noble-diagnostics/gtk4-wayland-preview.png" \
              > noble-diagnostics/gtk4-wayland-preview.log 2>&1 || preview_rc=$?
            echo "Preview exit code: ${preview_rc:-0}"
            if [ "${preview_rc:-0}" -ne 0 ]; then
              cat noble-diagnostics/gtk4-wayland-preview.log
              exit 1
            fi
            test -s noble-diagnostics/gtk4-wayland-preview.png
            file noble-diagnostics/gtk4-wayland-preview.png
            echo "PASS: interactive GTK4 window rendered a PNG snapshot in headless Wayland."
            echo "PASS: GTK4 GUI executable starts its help path with Wayland and session DBus available."
            echo "NOT TESTED: actual interactive tray lifecycle, D-Bus activation, Bluetooth."
          '

      - name: Upload diagnostics even if compilation fails
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-noble-compatibility-diagnostics
          path: noble-diagnostics/
          if-no-files-found: warn
